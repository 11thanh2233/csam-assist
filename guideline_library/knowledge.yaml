# Mẫu skeleton để tạo label kiểu skeleton trong CVAT. Toạ độ (0-100) là vị trí điểm trong khung mẫu của CVAT;
# edges đánh số từ 1 theo thứ tự points. `aliases`: tên khác của label, để nhận ra label task đã có (vd. person_vf17). Tên điểm là SỐ đúng như hai guideline quy định:
#   - person: 17 điểm 1-17 của HumanPose-17. R (số chẵn) nằm bên PHẢI ảnh, L (số lẻ) bên TRÁI ảnh; 18 cạnh.
#     Màu điểm theo hình minh hoạ của guideline (mũi đỏ, mắt xanh dương, tai xanh ngọc, vai tím, cổ tay vàng, hông hồng, gối xanh lá, cổ chân xám).
#   - 7 skeleton mặt của Facial Landmark-50: Point ID chạy liên tục 0-49, không reset theo từng skeleton.
#     Màu từng skeleton theo chú giải trong hình của guideline (đỏ, xanh dương, vàng, tím hồng, xanh ngọc, xanh lá, cam).
#     Điểm đầu của mỗi skeleton tô vàng (songmui: trắng) để thấy chiều đánh số (vòng kín: cùng chiều kim đồng hồ từ điểm trái nhất).
