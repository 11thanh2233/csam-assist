# Kiến thức rút từ các guideline mẫu trong reference/. Tool dùng file này để soạn bản nháp khi không có LLM,
# và làm tài liệu nền khi có LLM. Sửa hoặc thêm tuỳ ý; thay đổi có hiệu lực ở lần soạn kế tiếp.

# Định nghĩa class đã được các guideline mẫu chốt. Khoá = tên chuẩn hoá (chữ thường, khoảng trắng).
definitions:
  pedestrian: "Người đi bộ: đang đứng, đi, chạy, ngồi hoặc có tư thế khác. Không bao gồm vật dụng cá nhân như túi xách, ba lô, ô."
  person: "Người đi bộ, đứng hoặc ngồi không thuộc rider."
  rider: "Người đang điều khiển hoặc ngồi trên phương tiện hai bánh."
  car: "Ô tô con và xe van dùng để chở người."
  truck: "Xe tải và xe van dùng để chở hàng."
  bus: "Các loại xe buýt."
  train: "Tàu hoả."
  motorcycle: "Xe máy."
  bicycle: "Xe đạp."
  traffic light: "Đèn tín hiệu giao thông. Phần cột hoặc giá đỡ không thuộc class này."
  traffic sign: "Biển báo giao thông. Phần cột hoặc giá đỡ không thuộc class này."
  pole: "Cột và giá đỡ dạng mảnh (cột đèn, cột biển báo)."
  road: "Phần mặt đường dành cho phương tiện."
  sidewalk: "Lối đi bộ hoặc phần vỉa hè tách khỏi mặt đường."
  building: "Bề mặt thuộc công trình, toà nhà."
  wall: "Tường độc lập hoặc tường ranh giới, kết cấu kín/đặc."
  fence: "Hàng rào dạng thanh, lưới hoặc kết cấu có khoảng hở."
  vegetation: "Cây, bụi cây, tán lá."
  terrain: "Bề mặt địa hình tự nhiên như đất, cỏ thấp."
  sky: "Bầu trời."
  crosswalk: "Vạch kẻ đường dành cho người đi bộ sang đường."
  curb: "Đường biên bó vỉa, phân cách mặt đường với vỉa hè hoặc khu vực liền kề."
  lane line: "Vạch kẻ làn đường, gồm cả nét đứt và nét liền."
  face: "Khuôn mặt người thật trong cảnh."
  longmaytrai: "Lông mày phía TRÁI ảnh, 5 điểm 0-4 trên bờ trên (ranh giới lông mày và da trán), chia đều 4 đoạn; 0 = đuôi ngoài, 4 = đầu trong. Contour hở."
  longmayphai: "Lông mày phía PHẢI ảnh, 5 điểm 5-9 trên bờ trên, chia đều 4 đoạn; 5 = đầu trong, 9 = đuôi ngoài. Contour hở."
  songmui: "Sống mũi, 4 điểm 10-13 chia đều; 10 = đỉnh sống mũi (điểm lõm giữa hai mắt, ngang khoé mắt trong), 13 = chân sống mũi, phía trên lỗ mũi, chưa chạm chóp mũi. Contour hở."
  mattrai: "Mắt phía TRÁI ảnh, contour kín 8 điểm 14-21 trên bờ mi; 14 = khoé ngoài, 18 = khoé trong; mí trên 15-17 từ trái sang phải ở 1/4, 1/2, 3/4 chiều rộng mắt; mí dưới 19-21 vòng về."
  matphai: "Mắt phía PHẢI ảnh, contour kín 8 điểm 22-29 trên bờ mi; 22 = khoé trong, 26 = khoé ngoài; mí trên 23-25 từ trái sang phải; mí dưới 27-29 vòng về."
  moingoai: "Môi ngoài, contour kín 12 điểm 30-41 trên ranh giới môi đỏ và da; 30 và 36 là hai khoé miệng, 33 và 39 là mốc giữa; bờ trên 31-35 theo tỉ lệ 0,18 / 0,36 / 0,50 / 0,66 / 0,84 chiều rộng môi; bờ dưới 37-41 chia đều từ phải sang trái."
  moitrong: "Môi trong, contour kín 8 điểm 42-49 trên mép trong môi, luôn nằm hoàn toàn trong môi ngoài; 42 và 46 là hai khoé, 44 và 48 là mốc giữa. Miệng đóng vẫn đủ 8 điểm, các cặp trên/dưới được trùng nhau."
  double white: "Vạch kẻ đường đôi màu trắng, dùng cho cả vạch nét đứt và nét liền."
  double yellow: "Vạch kẻ đường đôi màu vàng, dùng cho cả vạch nét đứt và nét liền."
  double other: "Vạch kẻ đường đôi không phải trắng hoặc vàng, dùng cho cả vạch nét đứt và nét liền."
  single white: "Vạch kẻ đường đơn màu trắng, dùng cho cả vạch nét đứt và nét liền."
  single yellow: "Vạch kẻ đường đơn màu vàng, dùng cho cả vạch nét đứt và nét liền."
  single other: "Vạch kẻ đường đơn không phải trắng hoặc vàng, dùng cho cả vạch nét đứt và nét liền."
  road curb: "Đường biên bó vỉa, phân cách mặt đường với vỉa hè hoặc khu vực liền kề."
  direct: "Vùng mặt đường mà xe đang di chuyển hoặc có thể tiếp tục di chuyển trực tiếp, không cần chuyển làn hay đổi hướng."
  alternative: "Vùng mặt đường xe có thể chuyển sang khi đường có nhiều làn cùng chiều; không vẽ đường ngược chiều."
  traffic_light: "Đèn tín hiệu giao thông. Phần cột hoặc giá đỡ không thuộc class này."
  traffic_sign: "Biển báo giao thông. Phần cột hoặc giá đỡ không thuộc class này."

# Quy tắc phân biệt các cặp dễ nhầm (thứ tự trong cặp không quan trọng).
pairs:
  - {a: car, b: truck, rule: "Phân loại theo loại phương tiện thực tế: van chở người là car, van chở hàng là truck. Không đủ bằng chứng thì tạo Issue UNCERTAIN_CLASS."}
  - {a: car, b: van, rule: "Van chở người gán car; van chở hàng gán truck."}
  - {a: truck, b: van, rule: "Van chở hàng gán truck; van chở người gán car."}
  - {a: truck, b: bus, rule: "Phân loại theo loại phương tiện thực tế; không đủ bằng chứng thì tạo Issue."}
  - {a: person, b: rider, rule: "Rider là người đang điều khiển hoặc ngồi trên phương tiện; người đi bộ, đứng hoặc ngồi không trên phương tiện là person."}
  - {a: pedestrian, b: rider, rule: "Rider là người đang điều khiển hoặc ngồi trên phương tiện hai bánh; còn lại là pedestrian."}
  - {a: road, b: sidewalk, rule: "Road là phần mặt đường cho phương tiện; sidewalk là lối đi bộ tách khỏi mặt đường."}
  - {a: building, b: wall, rule: "Building là bề mặt thuộc công trình; wall là tường độc lập hoặc tường ranh giới."}
  - {a: wall, b: fence, rule: "Wall kín/đặc; fence dạng thanh, lưới, có khoảng hở."}
  - {a: vegetation, b: terrain, rule: "Vegetation là cây, bụi, tán lá; terrain là đất, cỏ thấp."}
  - {a: tree, b: bush, rule: "Cả hai thuộc vegetation nếu taxonomy không tách riêng."}
  - {a: pole, b: traffic light, rule: "Vẽ riêng phần đèn tín hiệu và phần cột/giá đỡ theo đúng class."}
  - {a: pole, b: traffic sign, rule: "Vẽ riêng phần biển và phần cột/giá đỡ theo đúng class."}
  - {a: motorcycle, b: bicycle, rule: "Phân loại theo loại xe thực tế (có động cơ hay không); quá bé không phân biệt được thì tạo Issue LOW_VISIBILITY."}

# Bảng Issue type dùng chung cho mọi guideline của lớp.
issue_types:
  - {code: UNCERTAIN_CLASS, example: "car/van vs truck"}
  - {code: UNCERTAIN_BOUNDARY, example: "không rõ extent do occlusion"}
  - {code: UNCERTAIN_SCOPE, example: "không chắc object có thuộc phạm vi bài"}
  - {code: ATTRIBUTE_CHECK, example: "không chắc occluded / truncated"}
  - {code: LOW_VISIBILITY, example: "thiếu sáng, ngược sáng, mưa, sương mù, quá bé, motion blur"}

reviewer_criteria:
  - {name: Taxonomy, check: "Đúng class, không class ngoài scope"}
  - {name: Completeness, check: "Không thiếu, không thừa object/vùng rõ ràng"}
  - {name: Geometry Accuracy, check: "Shape sát đối tượng, đúng hình học"}
  - {name: Attributes, check: "Attribute đúng quy tắc"}
  - {name: Consistency, check: "Áp dụng thống nhất giữa các thành viên và xuyên suốt batch"}
  - {name: Escalation, check: "Case chưa có rule được đưa mentor/lead chốt, không tự đặt rule"}

# Bài học khởi đầu: các quyết định mà guideline mẫu hoặc người duyệt đã chốt trong các bộ trước.
# `question` = khoá câu hỏi mà bài học trả lời (để lần sau tool điền sẵn); `tags` = bối cảnh áp dụng.
seed_lessons:
  - {question: reflections, answer: not_label, tags: [any],
     text: "Không gán reflection, bóng đổ, poster, hình trên billboard/màn hình, tượng thành object thật (cả 3 guideline ảnh đều quy định)."}
  - {question: occlusion_box, answer: visible, tags: [detection],
     text: "Detection trên ảnh tĩnh: box bao sát phần cần annotate và bật occluded khi bị che (guideline BBox)."}
  - {question: occlusion_box, answer: amodal, tags: [tracking],
     text: "Tracking: box vẫn ở vị trí toàn thân ước lượng khi bị che một phần, kèm occluded; đổi quy ước giữa chừng làm box co giật (guideline Lab 5)."}
  - {question: truncated_attr, answer: "yes", tags: [detection],
     text: "Object bị cắt bởi biên ảnh: bật truncated (guideline BBox)."}
  - {question: "min_size", answer: "none", tags: [keypoints],
     text: "Keypoint người lái: không đặt ngưỡng kích thước. Ảnh chỉ có một đối tượng cần gán (người lái), khó quan sát thì tạo Issue LOW_VISIBILITY (HumanPose-17, Facial Landmark-50)."}
  - {question: kp_lr, answer: image, tags: [keypoints],
     text: "Trái/phải theo phía của ẢNH: R (số chẵn) ở bên phải ảnh, L (số lẻ) ở bên trái ảnh, bất kể người quay mặt, quay lưng hay vặn mình; không suy luận theo tay/chân giải phẫu (HumanPose-17). Với mặt: 'trai'/'phai' theo khuôn mặt nhìn thấy trên ảnh (Facial Landmark-50)."}
  - {question: kp_scope, answer: driver, tags: [keypoints],
     text: "Mỗi ảnh chỉ gán một người / một khuôn mặt: người lái. Không có người lái thì bỏ qua ảnh; có người thứ hai thì không gán người đó (HumanPose-17, Facial Landmark-50)."}
  - {question: "line_mode:crosswalk", answer: long_edges, tags: [detection],
     text: "Crosswalk vẽ hai polyline theo hai mép dài của cả vùng, không vẽ tim từng sọc (người duyệt sửa ở bộ BBox/Polyline)."}
  - {question: "line_mode:double", answer: edges, tags: [detection],
     text: "Vạch đôi vẽ hai polyline theo hai mép ngoài của cả cặp vạch, kéo suốt chiều dài (người duyệt sửa ở bộ BBox/Polyline)."}
  - {question: "line_mode:*", answer: centerline, tags: [detection],
     text: "Vạch đơn và curb vẽ một polyline theo tim vạch, không nối tắt qua vùng không có vạch."}
  - {question: low_visibility, answer: issue, tags: [any],
     text: "Object khó quan sát (tối, mờ, quá bé): vẫn gán nếu xác định được class, và tạo Issue LOW_VISIBILITY; không đoán cho xong."}
  - {tags: [keypoints],
     text: "Ba trạng thái bằng property có sẵn của CVAT: Visible (thấy trực tiếp), Occluded (bị che nhưng nằm trong khung hình và suy ra được từ điểm liền kề, tư thế, tỉ lệ), Outside (ngoài khung hình hoặc không còn căn cứ ước lượng). Không dùng Hidden thay Outside: Hidden chỉ ẩn hiển thị, không lưu vào dữ liệu."}
  - {tags: [keypoints],
     text: "Sai số cho phép: ±5 pixel với điểm Visible, ±20 pixel với điểm Occluded."}
  - {tags: [keypoints],
     text: "Hai điểm Visible không thể trùng toạ độ: tách đúng vị trí, hoặc đánh lại trạng thái cho điểm không thực sự thấy. Ngoại lệ của mặt: mắt nhắm và miệng đóng thì các cặp mí trên/mí dưới, môi trên/môi dưới được trùng nhau."}
  - {tags: [keypoints],
     text: "Skeleton mặt bị che: còn thấy từ nửa số điểm (mắt 4/8, lông mày 3/5, môi ngoài 6/12, môi trong 4/8, sống mũi 2/4) thì đặt đủ contour, điểm không thấy là Occluded; thấy ít hơn thì chỉ đặt đủ khi có bằng chứng thị giác, không thì Outside cả skeleton. Kính trong suốt vẫn là Visible; kính râm đen không xác định được điểm là Outside."}
  - {tags: [keypoints],
     text: "Mặt nghiêng mạnh: không dồn các điểm của nửa mặt phía xa về giữa mặt; ước lượng được thì Occluded, không thì Outside cả skeleton đó."}
  - {tags: [tracking],
     text: "Khuất ≤ 60 frame và chắc cùng người thì giữ ID; lâu hơn hoặc không chắc thì track mới và ghi vào báo cáo."}
  - {tags: [tracking],
     text: "Keyframe ở frame đầu/cuối, chỗ đổi hướng, đổi tốc độ, đổi kích thước, ngay trước và sau khi bị che; box nội suy có IoU < 0,7 là trôi."}
  - {tags: [semantic],
     text: "Semantic segmentation: hai class không cùng chiếm một pixel; không để sót pixel giữa các vùng đã rõ; không lấp vùng chưa rõ bằng class suy đoán."}
  - {tags: [any],
     text: "Chỉ annotate class trong taxonomy: không tự tạo class mới, không đổi tên, không gộp class theo cảm tính."}
  - {tags: [any],
     text: "Case không chắc: majority voting trong nhóm trước, rồi tạo Issue theo 5 loại chuẩn gửi mentor; không tự đặt rule mới."}

