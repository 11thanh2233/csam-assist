# Các bộ skeleton đi cùng nhau: một câu hỏi tạo cả bộ.
#   detect      = khái niệm tool tìm trong ảnh mẫu để gợi ý có nên tạo bộ này không
#   definitions = định nghĩa dùng cho label của bộ khi task là keypoint (thay cho định nghĩa chung ở trên)
#   rules       = các dòng luật riêng của bộ, đưa vào mục "Skeleton" của bản nháp (mã luật = kp.<bộ>.<id>)
skeleton_sets:
  pose17:
    title: "HumanPose-17: skeleton person, 17 điểm"
    guideline: "HumanPose17_Annotation_Guideline_V1"
    detect: person
    labels: [person]
    definitions:
      person: "Người lái. Một skeleton 17 keypoint đặt tên 1-17: 1 mũi; 2/3 mắt; 4/5 tai; 6/7 vai; 8/9 khuỷu; 10/11 cổ tay; 12/13 hông; 14/15 gối; 16/17 cổ chân. Số chẵn là R, số lẻ là L."
    rules:
      - {id: head, text: "Vùng đầu. 1 – Nose: chóp mũi; mặt nghiêng vẫn là chóp mũi, không dời về giữa mặt. 2/3 – Eye: tâm đồng tử (mắt nhắm: tâm khe mí). 4/5 – Ear: ống tai, không phải chóp hay dái tai; tóc phủ kín tai mà ước lượng được thì Occluded, không thì Outside."}
      - {id: arms, text: "Chi trên. 6/7 – Shoulder: tâm khớp vai, tại điểm xoay của cánh tay. 8/9 – Elbow: tâm khớp khuỷu. 10/11 – Wrist: tâm khớp cổ tay, ở nếp gấp cổ tay; tay trên vô-lăng vẫn không dời lên vành vô-lăng."}
      - {id: legs, text: "Thân và chi dưới. 12/13 – Hip: tâm khớp háng, không phải mép ngoài hông hay cạp quần. 14/15 – Knee: tâm khớp gối, giữa xương bánh chè. 16/17 – Ankle: tâm khớp cổ chân, ngang mắt cá."}
      - {id: chain, text: "Người lái vặn mình hoặc quay lưng: không đảo quy ước R/L. Kiểm tra chéo: chuỗi vai–khuỷu–cổ tay và hông–gối–cổ chân mỗi phía phải liền mạch, không bắt chéo sang bên kia thân."}
      - {id: occluder, text: "Bị che bởi đồ vật (ghế, cần số, dây an toàn) hoặc bởi chính cơ thể do góc camera chéo: còn khớp liền kề thấy rõ để nội suy thì đặt điểm và gán Occluded; không còn dấu hiệu để nội suy thì Outside."}
      - {id: prelabel, text: "Pre-label sai nhiều: kéo cả cụm keypoint về đúng chỗ và điền đúng trạng thái; không giữ nguyên vì 'gần đúng'."}
  face50:
    title: "Facial Landmark-50: 7 skeleton mặt, 50 điểm"
    guideline: "Face_Landmark50_Annotation_Guideline_V1"
    detect: face
    labels: [longmaytrai, longmayphai, songmui, mattrai, matphai, moingoai, moitrong]
    rules:
      - {id: ids, text: "Đủ 7 skeleton và 50 điểm. Point ID chạy liên tục 0–49 qua cả 7 skeleton, không reset theo từng skeleton. Tên label viết liền, không dấu, không viết hoa, không đổi."}
      - {id: order, text: "Vòng kín (mắt, môi) có toạ độ chạy cùng chiều kim đồng hồ, bắt đầu từ điểm trái nhất: bờ trên từ trái sang phải, rồi vòng về theo bờ dưới."}
      - {id: threshold, text: "Cả một bộ phận bị che: còn thấy từ mattrai/matphai 4/8, longmaytrai/longmayphai 3/5, moingoai 6/12, moitrong 4/8, songmui 2/4 điểm thì đặt đủ contour, điểm không thấy đánh Occluded. Thấy ít hơn: đặt đủ nếu có đủ bằng chứng thị giác; còn không thì Outside cả skeleton."}
      - {id: turned, text: "Mặt nghiêng mạnh: lông mày và mắt phía xa bị che, pre-label thường dồn cụm điểm về giữa mặt. Chỉnh từng cụm cho hợp lý, không dồn điểm về giữa mặt; không ước lượng được thì Outside skeleton đó."}
      - {id: eye_closed, text: "Nheo hoặc nhắm mắt: vẫn đủ 8 điểm thành vòng kín; mí trên và mí dưới nằm sát hoặc trùng nhau theo khe mí (các cặp 15–21, 16–20, 17–19 được trùng), hai khoé vẫn đúng vị trí. Visible nếu còn xác định được khe mí; chỉ Occluded khi mắt bị vật khác che."}
      - {id: mouth, text: "Miệng mở: moitrong tách khỏi moingoai, ôm khoang miệng thật; thấy răng hoặc lưỡi thì đặt lên mép môi; làm điểm 44 và 48 trước rồi chia các điểm còn lại. Miệng đóng: moitrong vẫn đủ 8 điểm dọc đường khép môi, các cặp 43–49, 44–48, 45–47 được trùng hoặc gần trùng; không xoá moitrong, không Outside chỉ vì miệng đóng."}
      - {id: occluder, text: "Bị che bởi kính, tay, vô-lăng, dây an toàn: đeo kính mà vẫn xác định được điểm thì Visible; bị che nhưng ước lượng được thì Occluded; không xác định hoặc suy luận được (ví dụ kính râm đen) thì Outside. Không đặt điểm lên vật che hoặc ra ngoài vùng khuôn mặt."}
      - {id: prelabel, text: "Pre-label đã đúng: giữ nguyên vị trí nhưng vẫn phải đặt trạng thái cho cả 50 điểm."}

# Bảng Issue type và tiêu chí reviewer riêng cho bài keypoint (hai guideline HumanPose-17 và Facial Landmark-50).
issue_types_keypoints:
  - {code: UNCERTAIN_CLASS, example: "không chắc điểm thuộc R hay L khi người lái vặn mình/quay lưng; không chắc nhóm điểm thuộc mattrai hay matphai khi mặt nghiêng mạnh"}
  - {code: UNCERTAIN_BOUNDARY, example: "không rõ vị trí điểm do bị vô-lăng, ghế, quần áo, gọng kính, tay che"}
  - {code: UNCERTAIN_SCOPE, example: "không xác định được ai là người lái; có skeleton hoặc khuôn mặt thứ hai (hành khách, phản chiếu); ảnh không có mặt"}
  - {code: ATTRIBUTE_CHECK, example: "không chắc Visible / Occluded / Outside"}
  - {code: LOW_VISIBILITY, example: "thiếu sáng, ngược sáng, loá kính, nhoè, mặt quá nhỏ, không phân biệt được người với ghế"}

reviewer_criteria_keypoints:
  - {name: Taxonomy & Completeness, check: "Đúng label và số điểm (person: 17 sublabel 1–17; mặt: 7 skeleton, 50 điểm); không bỏ sót người lái, không skeleton thừa; mọi điểm có trạng thái"}
  - {name: Keypoint Accuracy, check: "Vị trí trong sai số cho phép so với vị trí chuẩn: ±5 px điểm Visible, ±20 px điểm Occluded"}
  - {name: Left/Right & Topology, check: "R bên phải ảnh, L bên trái ảnh; chuỗi vai–khuỷu–cổ tay và hông–gối–cổ chân đúng thứ tự, không bắt chéo; mắt không bắt chéo, moitrong nằm trong moingoai"}
  - {name: Consistency, check: "Áp dụng thống nhất giữa các thành viên và xuyên suốt batch"}
  - {name: Escalation, check: "Case chưa có rule được đưa mentor/lead chốt, không tự đặt rule"}
