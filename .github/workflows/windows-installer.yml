# Kiểm thử rồi dựng bộ cài Windows (SAM3-CVAT-Assist-Setup-<bản>.exe).
#   - Mỗi lần push lên main: chạy test + dựng bộ cài, tải về ở mục Actions → Artifacts.
#   - Push tag v<bản> (ví dụ v0.6.0): như trên và đăng bộ cài lên mục Releases.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"          # log tiếng Việt: Windows mặc định dùng cp1252
  PYTHONIOENCODING: utf-8

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cài thư viện
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --no-save jsdom acorn@8 acorn-walk@8
      - name: Test backend + desktop
        run: python -m pytest -q
      - name: Test userscript và shim desktop (trình duyệt giả)
        run: |
          node tests/userscript_smoke.cjs
          node tests/userscript_smoke_v2.cjs
          node tests/desktop_shim_smoke.cjs
          node tests/desktop_control_smoke.cjs
          node tests/userscript_smoke_v3.cjs
          node tests/userscript_i18n_smoke.cjs

  crossplatform:
    # Bản desktop chạy từ mã nguồn trên macOS / Linux (chưa có bộ cài .dmg / .AppImage)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt pywebview pystray keyring
      - name: Test desktop + 0.8.0
        run: python -m pytest -q tests/test_desktop.py tests/test_v080.py
      - name: App chạy từ mã nguồn (chế độ hệ thống) + backend giả lập
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request, tempfile
          from pathlib import Path
          os.environ["SAM3_DESKTOP_DATA"] = tempfile.mkdtemp()
          import desktop.app, desktop.control
          from desktop.paths import Paths
          from desktop.components import Components
          from desktop.backend_proc import BackendProcess
          c = Components(Paths())
          assert c.system, "chạy từ mã nguồn: không có manifest"
          env = dict(os.environ, SAM3_ENGINE="mock", SAM3_PORT="8790")
          p = subprocess.Popen([sys.executable, "-m", "desktop.run_backend"], env=env)
          try:
              for _ in range(60):
                  try:
                      h = json.load(urllib.request.urlopen("http://127.0.0.1:8790/health", timeout=2))
                      if h["ok"]:
                          print("backend từ mã nguồn:", h["engine"], h["version"]); break
                  except OSError:
                      time.sleep(1)
              else:
                  raise SystemExit("backend không chạy")
          finally:
              p.terminate()
          PY

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    permissions:
      contents: write          # chỉ dùng để đăng Release khi push tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Công cụ build
        run: python -m pip install --upgrade pip sigstore
      - name: Test desktop trên Windows
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_desktop.py

      - name: Dựng runtime + manifest (kiểm chữ ký Python, mã băm thư viện, PyTorch CUDA có sm_75)
        run: python installer/build.py --out build --verify-torch

      - name: Biên dịch SAM3 Assist.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /win32icon:installer\icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll `
            "/out:build\SAM3 Assist.exe" installer\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc lỗi" }

      - name: Kiểm runtime đã dựng
        shell: pwsh
        run: |
          $py = "build\runtime\python.exe"
          & $py -I -X utf8 -c "import backend.app, desktop.app, desktop.control, webview, pystray, keyring, transformers, mediapipe; from mediapipe.tasks.python import vision; import importlib.util as u; assert u.find_spec('transformers.models.sam3'), 'transformers thiếu SAM3'; assert u.find_spec('transformers.models.vitpose'); print('runtime OK', transformers.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "runtime lỗi" }
          $lib = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\lib"
          $env:SAM3_ENGINE = "mock"; $env:SAM3_PORT = "8799"; $env:SAM3_LIBRARY_DIR = $lib.FullName
          $p = Start-Process -FilePath $py -ArgumentList "-I", "-m", "desktop.run_backend" -WorkingDirectory "build\app" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $h = Invoke-RestMethod "http://127.0.0.1:8799/health"; if ($h.ok) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "backend trong runtime không chạy" }
          Write-Host "backend mock trong runtime: OK"

      - name: Thử tải và cài PyTorch như trên máy người dùng, rồi nạp các lớp model của transformers
        shell: pwsh
        run: |
          $env:SAM3_DESKTOP_DATA = "$env:RUNNER_TEMP\desktop-data"
          & build\runtime\python.exe -I -X utf8 -c @"
          import sys
          from desktop.paths import Paths
          from desktop.components import Components, Gpu
          p = Paths(app_dir=r'$PWD\build\app').ensure()
          c = Components(p)
          info = c.install('torch', gpu=Gpu('CI', 8192, '560.0'), progress=lambda **k: None)
          print('installed', info)
          sys.path.insert(0, str(p.packages))
          import torch, torchvision
          print('torch', torch.__version__, 'cuda', torch.version.cuda)
          from transformers import Sam3Model, Sam3Processor, Sam3VideoModel, Sam3VideoProcessor, Sam3TrackerModel, Sam3TrackerProcessor, VitPoseForPoseEstimation
          print('transformers: SAM3 + SAM3 Video + SAM3 Tracker + ViTPose OK')
          "@
          if ($LASTEXITCODE -ne 0) { throw "cài PyTorch theo manifest lỗi" }
          # Model riêng của dự án: huấn luyện thử vài vòng trên CPU bằng chính PyTorch vừa cài
          & build\runtime\python.exe -X utf8 tests\custom_model_smoke.py "$env:SAM3_DESKTOP_DATA\packages"
          if ($LASTEXITCODE -ne 0) { throw "model riêng lỗi" }

      - name: Ký số SAM3 Assist.exe (khi repo có chứng chỉ)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "build\SAM3 Assist.exe"
          if ($LASTEXITCODE -ne 0) { throw "ký số lỗi" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Đóng gói bằng Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (Select-String -Path backend/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$v" "/DBuildDir=..\build" installer\sam3-assist.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC lỗi" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem dist | Format-Table Name, Length

      - name: Ký số bộ cài (khi repo có chứng chỉ)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $setup = (Get-ChildItem dist\*.exe)[0].FullName
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { throw "ký số bộ cài lỗi" }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Thử cài im lặng, chạy, gỡ
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*.exe)[0].FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\SAM3 CVAT Assist"
          if (-not (Test-Path "$app\SAM3 Assist.exe")) { Get-Content install.log -Tail 40; throw "chưa cài được" }
          & "$app\runtime\python.exe" -I -X utf8 -c "import desktop.components as c, desktop.paths as p; m = c.load_manifest(p.Paths()); print('manifest', m['version'], m['torch']['cuda_index'])"
          if ($LASTEXITCODE -ne 0) { throw "app đã cài không chạy" }
          & "$app\runtime\python.exe" -I -X utf8 -c "from desktop import updater as U; i = U.check('0.0.1'); print('GitHub Releases:', i['version'], 'tự cập nhật được' if i['auto'] else i['reason'])"
          # Cập nhật như từ trong app: cài đè ở chế độ /update=1, xong phải tự mở lại app
          # -Wait của PowerShell đợi cả tiến trình con (app được mở lại) nên sẽ treo: chỉ đợi bộ cài.
          $u = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/update=1", "/LOG=update.log" -PassThru
          if (-not $u.WaitForExit(600000)) { throw "bộ cài chế độ cập nhật chạy quá 10 phút" }
          $relaunched = $false
          for ($i = 0; $i -lt 30; $i++) {
            $procs = Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" | Where-Object { $_.ExecutablePath -like "$app*" }
            if ($procs) { $relaunched = $true; $procs | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }; break }
            Start-Sleep 1
          }
          if (-not $relaunched) { Get-Content update.log -Tail 30; throw "cập nhật xong không tự mở lại app" }
          Write-Host "cập nhật /update=1: app tự mở lại OK"
          Start-Sleep 2
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path "$app\runtime") { throw "gỡ cài đặt chưa sạch" }
          Write-Host "cài / gỡ: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: SAM3-CVAT-Assist-Setup-${{ env.VERSION }}
          path: |
            dist/*.exe
            build/app/desktop/manifest.lock.json
            build/build-info.json
          retention-days: 30

      # Ký qua SignPath Foundation (miễn phí cho mã nguồn mở) khi phát hành, nếu repo đã được SignPath duyệt.
      # Cần: secret SIGNPATH_API_TOKEN, biến SIGNPATH_ORGANIZATION_ID (Settings → Secrets and variables → Actions). Xem docs/SIGNING.md.
      - name: Gửi bộ cài cho SignPath ký
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/*.exe
      - name: SignPath ký bộ cài
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'csam-assist' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Dùng bộ cài đã ký
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist-signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath không trả về bộ cài đã ký" }
          Copy-Item $signed.FullName (Get-ChildItem dist\*.exe)[0].FullName -Force
          Write-Host "Đã thay bằng bộ cài đã ký: $($signed.Name)"

      - name: Đăng Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("v$env:VERSION" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME khác phiên bản v$env:VERSION trong backend/__init__.py" }
          $exe = (Get-ChildItem dist\*.exe)[0].FullName
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $section = & build\runtime\python.exe -I -X utf8 -c "import sys; from desktop.changelog import section; print(section(r'docs/CHANGELOG.md', sys.argv[1]))" $env:VERSION
          if (-not $section) { throw "docs/CHANGELOG.md chưa có mục ## $env:VERSION" }
          $sectionEn = & build\runtime\python.exe -I -X utf8 -c "import sys; from desktop.changelog import section; print(section(r'docs/CHANGELOG.en.md', sys.argv[1]))" $env:VERSION
          if (-not $sectionEn) { throw "docs/CHANGELOG.en.md chưa có mục ## $env:VERSION" }
          # Hai phần: tiếng Việt, rồi tiếng Anh sau dòng <!-- en --> (app hiện phần đúng ngôn ngữ giao diện)
          $notes = ($section -join "`n") + "`n`nHướng dẫn cài: docs/DESKTOP.md`n`nSHA-256 của bộ cài: ``$hash``" +
                   "`n`n<!-- en -->`n" + ($sectionEn -join "`n") + "`n`nInstall guide: docs/DESKTOP.md`n`nInstaller SHA-256: ``$hash``"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $exe build\app\desktop\manifest.lock.json build\build-info.json `
            --title "SAM3 CVAT Assist $env:VERSION" --notes-file notes.md
